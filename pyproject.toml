[project]
name = "mavg-web"
version = "0.1.0"
description = "Formulaire web qui pousse des tâches MAVG dans la file MongoDB du worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.105",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["app/task_config.py"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mongomock>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
