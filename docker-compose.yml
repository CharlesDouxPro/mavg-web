# Le service web seul, avec la configuration de .env :
#   docker compose up -d --build              → http://localhost:8080
#
# Pour essayer sans toucher à la vraie file, une base locale jetable :
#   docker compose --profile local-db up -d --build
# avec, dans .env : MONGO_CONNECTION_STRING=mongodb://mongo:27017
#
# mongo:8.2 et pas 8 ou latest : ces images refusent de démarrer sur un noyau Linux ≥ 6.19
# (SERVER-121912).

name: mavg-web

services:
  web:
    build: .
    # Tag poussé par `scripts/push.sh` (le SHA du commit) ; `dev` pour un build local.
    image: rg.fr-par.scw.cloud/mavg-container-registery/mavg-web:${WEB_TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:8.2
    profiles: [local-db]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
